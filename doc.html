<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TheSuperEevee — Documentation</title>

    <meta
      name="description"
      content="Documentation and guides for TheSuperEevee projects and software."
    />

    <meta name="theme-color" content="#111217" />

    <script>
      (() => {
        const saved = localStorage.getItem("thesupereevee-theme");

        document.documentElement.dataset.theme =
          saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      })();
    </script>

    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/pages.css" />

    <script defer src="../js/config.js"></script>
    <script defer src="../js/components.js"></script>
    <script defer src="../js/theme.js"></script>
  </head>

  <body>
    <div id="site-header"></div>

    <main>
      <section class="section">
        <div class="container">
          <div class="section-heading">
            <div>
              <h2>Documentation</h2>
              <p class="section-description">
                Documentation and guides for my projects.
              </p>
            </div>
          </div>

          <div id="docs-content" class="docs-content">
            <p class="empty-state">Loading documentation...</p>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script>
      async function initializeDocsPage() {
        // Load shared components.
        await loadComponents();

        // Documentation content - separate from projects page.
        // Features documentation guides and project overviews organized by type.
        const docsHtml = `
          <div class="docs-intro">
            <h3>Welcome to the Documentation</h3>
            <p>
              Explore guides, tutorials, and project references organized by topic.
              Below you'll find documentation for my projects and standalone
              technical resources.
            </p>
          </div>

          <div class="docs-guides">
            <div class="docs-guide">
              <div class="guide-icon">
                <span data-lucide="code"></span>
              </div>
              <div class="guide-content">
                <h4>Project Guides</h4>
                <p>
                  Detailed documentation for each project including setup,
                  usage, and available features.
                </p>
                <a href="docs" class="guide-link">View project documentation →</a>
              </div>
            </div>

            <div class="docs-guide">
              <div class="guide-icon">
                <span data-lucide="search"></span>
              </div>
              <div class="guide-content">
                <h4>API References</h4>
                <p>
                  Reference documentation for libraries and utilities I've
                  built, including endpoints and parameters.
                </p>
                <a href="#" class="guide-link">View API docs →</a>
              </div>
            </div>

            <div class="docs-guide">
              <div class="guide-icon">
                <span data-lucide="terminal"></span>
              </div>
              <div class="guide-content">
                <h4>Configuration Guides</h4>
                <p>
                  How-to guides for configuring tools, environments, and
                  development workflows.
                </p>
                <a href="#" class="guide-link">View guides →</a>
              </div>
            </div>
          </div>

          <div class="docs-project-overview">
            <h3>Project Summaries</h3>
            <p>Quick references to my available projects:</p>
            <ul class="docs-project-list">
              <li>
                <a href="#eevee-launcher" class="doc-project-link">
                  <h4>Eevee Launcher</h4>
                  <p>Custom Minecraft launcher built with Rust and Tauri.</p>
                </a>
              </li>
              <li>
                <a href="#oplo-decompiler" class="doc-project-link">
                  <h4>OploDecompiler</h4>
                  <p>Java JAR decompilation tool with Python backend.</p>
                </a>
              </li>
            </ul>
          </div>
        `;

        document.getElementById("docs-content").innerHTML = docsHtml;

        // Initialize Lucide icons after content is inserted
        if (window.lucide) {
          setTimeout(() => {
            lucide.createIcons();
          }, 100);
        }
      }

      document.addEventListener("DOMContentLoaded", initializeDocsPage);
    </script>
  </body>
</html>
