<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Project | TheSuperEevee</title>
    <meta
      name="description"
      content="Explore projects and software developed by TheSuperEevee."
    />

    <meta name="color-scheme" content="light dark" />

    <link rel="stylesheet" href="../css/main.css" />

    <script src="../js/config.js"></script>
    <script src="../js/components.js" defer></script>
    <script src="../js/theme.js" defer></script>
    <script src="../js/project-detail.js" defer></script>
    <!-- Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Simple Icons -->
    <script src="https://cdn.jsdelivr.net/npm/simple-icons@v15"></script>
  </head>

  <body>
    <!-- Shared header -->
    <div id="site-header"></div>

    <main class="project-detail-page">
      <div class="project-detail-container">
        <!-- Back navigation -->
        <a href="../projects/" class="project-back-link" data-route="projects">
          <span aria-hidden="true">←</span>
          All projects
        </a>

        <!-- Loading state -->
        <div id="project-loading" class="project-loading">
          <div class="project-loading-spinner"></div>
          <p>Loading project...</p>
        </div>

        <!-- Project content -->
        <article id="project-content" class="project-detail" hidden>
          <header class="project-detail-header">
            <div class="project-detail-icon" id="project-icon">📦</div>

            <div class="project-detail-heading">
              <div class="project-detail-labels">
                <span id="project-category"></span>
                <span id="project-status"></span>
              </div>

              <h1 id="project-name"></h1>

              <p id="project-description"></p>
            </div>
          </header>

          <div class="project-detail-actions" id="project-actions">
            <!-- Links generated by JavaScript -->
          </div>

          <section class="project-detail-section">
            <h2>About this project</h2>
            <p id="project-about"></p>
          </section>

          <section
            class="project-detail-section"
            id="technologies-section"
            hidden
          >
            <h2>Technologies</h2>
            <div id="project-technologies" class="project-technologies"></div>
          </section>
        </article>

        <!-- Not found state -->
        <div id="project-not-found" class="project-not-found" hidden>
          <div class="project-not-found-icon">🔍</div>

          <h1>Project not found</h1>

          <p>
            We couldn't find that project. It may have been removed, or the URL
            might be incorrect.
          </p>

          <a href="../projects/" class="button-primary"> Browse projects </a>
        </div>
      </div>
    </main>

    <!-- Shared footer -->
    <div id="site-footer"></div>
  </body>
</html>
